# 群晖 NAS 部署用。镜像不在这里构建：用 ./build-image.sh <版本号> 打包成 tar，
# 在 NAS 上 docker load 之后由本文件按 image 名引用。
#
# name 必须与本机编排区分开：compose 的 project 名默认取目录名，与 -f 参数无关，
# 不写死的话两套编排会共用 project / 网络 / 卷 / 容器名 —— 在本机对着本机编排跑一次
# `docker compose down -v`，删掉的正是本文件声明的同名卷。
name: vue-fastapi-admin-nas

services:
  app:
    image: vue-fastapi-admin-app
    container_name: vue-fastapi-admin
    restart: always
    ports:
      - "7777:80"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password123
      - DB_NAME=vue_fastapi_admin
      # 微信小程序凭据。compose 只把 environment: 里列出的变量传进容器，
      # 不列在这里的话 NAS 上无论怎么配环境变量，容器内 settings.WX_APPID 恒为空，
      # 微信登录必然返回 40013。值本身从 NAS 侧的环境或同目录 .env 注入，不写进本文件。
      - WX_APPID=${WX_APPID:-}
      - WX_SECRET=${WX_SECRET:-}
    volumes:
      - app_data:/opt/vue-fastapi-admin/data
      # - /volume2/docker/life_plan/app:/opt/vue-fastapi-admin/data
    networks:
      - app-network

  mysql:
    image: mysql:8.1
    container_name: vue-fastapi-admin-mysql
    restart: always
    ports:
      - "3380:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password123
      - MYSQL_DATABASE=vue_fastapi_admin
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=app_password
    volumes:
      - mysql_data:/var/lib/mysql
      # - /volume2/docker/life_plan/mysql:/var/lib/mysql
    networks:
      - app-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-error-suppression-list="MY-013360"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword123" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
  app_data:
