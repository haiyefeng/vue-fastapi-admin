<!-- Place this before the closing </body> tag -->
<div id="task-detail-modal" class="modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="task-detail-title">完成项目报告初稿</h5>
                <button type="button" class="close" onclick="closeModal('task-detail-modal')" aria-label="Close">
                    <span aria-hidden="true">×</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <!-- Editable Title Input -->
                    <input type="text" class="form-control form-control-lg" value="完成项目报告初稿"
                        style="font-size: 1.2em; font-weight: 500; padding: 0.5em 0; border: none; box-shadow: none;">
                </div>
                <div class="form-group">
                    <textarea class="form-control" id="task-detail-description" rows="3"
                        placeholder="添加描述..."></textarea>
                </div>

                <div
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1em; margin-bottom: 1.5em;">
                    <div class="form-group">
                        <label for="task-detail-project"><i class="fas fa-folder"></i> 项目</label>
                        <select id="task-detail-project" class="form-control">
                            <option>工作 / Q4 营销活动</option>
                            <option>工作 / 官网改版</option>
                            <option>学习 / React</option>
                            <option>我的清单</option>
                            <option>收件箱</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="task-detail-due"><i class="far fa-calendar"></i> 截止日期</label>
                        <input type="date" id="task-detail-due" class="form-control" value="2023-12-13">
                        <!-- Could add time input too -->
                    </div>
                    <div class="form-group">
                        <label for="task-detail-priority"><i class="fas fa-flag"></i> 优先级</label>
                        <select id="task-detail-priority" class="form-control">
                            <option value="high">高</option>
                            <option value="medium">中</option>
                            <option value="low">低</option>
                            <option value="none">无</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="task-detail-reminder"><i class="far fa-bell"></i> 提醒</label>
                        <input type="datetime-local" id="task-detail-reminder" class="form-control">
                    </div>
                </div>

                <hr style="border: none; border-top: 1px solid var(--border-light); margin: 1.5em 0;">

                <section id="subtasks">
                    <h4 style="font-size: 1em; font-weight: 600; margin-bottom: 0.8em;">子任务/清单项</h4>
                    <ul class="task-list" style="margin-bottom: 1em;">
                        <li class="task-item" style="padding: 0.5em 0;">
                            <label class="checkbox-custom task-checkbox">
                                <input type="checkbox" checked>
                                <span class="checkmark"></span>
                            </label>
                            <div class="task-content">
                                <input type="text" class="form-control form-control-sm" value="收集数据"
                                    style="border:none; padding-left: 0;">
                            </div>
                            <div class="task-actions" style="display: flex;"> <!-- Show always in modal -->
                                <button class="button-icon"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </li>
                        <li class="task-item" style="padding: 0.5em 0;">
                            <label class="checkbox-custom task-checkbox">
                                <input type="checkbox">
                                <span class="checkmark"></span>
                            </label>
                            <div class="task-content">
                                <input type="text" class="form-control form-control-sm" value="撰写第一部分"
                                    style="border:none; padding-left: 0;">
                            </div>
                            <div class="task-actions" style="display: flex;">
                                <button class="button-icon"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </li>
                        <li class="task-item" style="padding: 0.5em 0;">
                            <label class="checkbox-custom task-checkbox">
                                <input type="checkbox">
                                <span class="checkmark"></span>
                            </label>
                            <div class="task-content">
                                <input type="text" class="form-control form-control-sm" value="图表制作"
                                    style="border:none; padding-left: 0;">
                            </div>
                            <div class="task-actions" style="display: flex;">
                                <button class="button-icon"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </li>
                    </ul>
                    <form style="display: flex;">
                        <input type="text" class="form-control form-control-sm" placeholder="添加子任务...">
                        <button type="submit" class="button button-primary button-sm"
                            style="margin-left: 0.5em; padding: 0.4em 0.8em;">添加</button>
                    </form>
                </section>

            </div>
            <div class="modal-footer">
                <button type="button" class="button button-danger" style="margin-right: auto;"><i
                        class="fas fa-trash-alt"></i> 删除任务</button>
                <button type="button" class="button" onclick="closeModal('task-detail-modal')">取消</button>
                <button type="button" class="button button-primary">保存更改</button>
            </div>
        </div>
    </div>
</div>
<script>
    // Basic JS to open/close modal (replace with proper framework logic)
    function openModal(id) { document.getElementById(id).style.display = 'block'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>
