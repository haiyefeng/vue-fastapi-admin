<!-- (Include <!DOCTYPE>, <head>, <body>, <header>, .main-container, <aside>) -->
<main class="content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5em;">
        <h2><i class="fas fa-briefcase"></i> 工作 / Q4 营销活动</h2>
        <div>
            <button class="button button-primary"><i class="fas fa-plus"></i> 添加任务</button>
            <button class="button"><i class="fas fa-sort-amount-down"></i> 排序</button>
            <button class="button"><i class="fas fa-filter"></i> 过滤</button>
            <button class="button"><i class="fas fa-ellipsis-h"></i></button>
        </div>
    </div>

    <ul class="task-list">
        <!-- Section for Overdue Tasks (Example) -->
        <li>
            <h4 style="color: var(--danger-color); margin: 1em 0 0.5em 0.5em; font-size: 0.9em;">已过期</h4>
        </li>
        <li class="task-item">
            <label class="checkbox-custom task-checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
            </label>
            <div class="task-content">
                <span class="task-title" onclick="openModal('task-detail-modal')">联系供应商确认物料</span>
                <div class="task-meta">
                    <span style="color: var(--danger-color);"><i class="far fa-calendar"></i> 昨天</span>
                    <span><i class="fas fa-flag priority-high"></i> 高</span>
                </div>
            </div>
            <div class="task-actions">
                <button class="button-icon"><i class="fas fa-calendar-plus"></i></button> <!-- Reschedule -->
                <button class="button-icon" onclick="openModal('task-detail-modal')"><i
                        class="fas fa-edit"></i></button>
                <button class="button-icon"><i class="fas fa-ellipsis-v"></i></button>
            </div>
        </li>

        <!-- Section for Today's Tasks -->
        <li>
            <h4 style="color: var(--primary-color); margin: 1em 0 0.5em 0.5em; font-size: 0.9em;">今天</h4>
        </li>
        <li class="task-item">
            <label class="checkbox-custom task-checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
            </label>
            <div class="task-content">
                <span class="task-title" onclick="openModal('task-detail-modal')">完成项目报告初稿</span>
                <div class="task-meta">
                    <span><i class="far fa-calendar"></i> 今天</span>
                    <span><i class="fas fa-flag priority-high"></i> 高</span>
                </div>
            </div>
            <div class="task-actions">
                <button class="button-icon"><i class="fas fa-calendar-plus"></i></button>
                <button class="button-icon" onclick="openModal('task-detail-modal')"><i
                        class="fas fa-edit"></i></button>
                <button class="button-icon"><i class="fas fa-ellipsis-v"></i></button>
            </div>
        </li>
        <li class="task-item">
            <label class="checkbox-custom task-checkbox">
                <input type="checkbox" checked> <!-- Example checked task -->
                <span class="checkmark"></span>
            </label>
            <div class="task-content">
                <span class="task-title" onclick="openModal('task-detail-modal')">撰写推广文案要点</span>
                <div class="task-meta">
                    <span><i class="far fa-calendar"></i> 今天</span>
                    <span><i class="fas fa-flag priority-medium"></i> 中</span>
                    <span class="tag"><i class="fas fa-tags"></i> 社交媒体</span>
                </div>
            </div>
            <div class="task-actions">
                <button class="button-icon"><i class="fas fa-calendar-plus"></i></button>
                <button class="button-icon" onclick="openModal('task-detail-modal')"><i
                        class="fas fa-edit"></i></button>
                <button class="button-icon"><i class="fas fa-ellipsis-v"></i></button>
            </div>
        </li>


        <!-- Section for Future Tasks -->
        <li>
            <h4 style="margin: 1em 0 0.5em 0.5em; font-size: 0.9em;">稍后</h4>
        </li>
        <li class="task-item">
            <label class="checkbox-custom task-checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
            </label>
            <div class="task-content">
                <span class="task-title" onclick="openModal('task-detail-modal')">设计宣传海报 V1</span>
                <div class="task-meta">
                    <span><i class="far fa-calendar"></i> 12月18日</span>
                    <span><i class="fas fa-flag priority-medium"></i> 中</span>
                    <span><i class="far fa-check-square"></i> 1/3 子任务</span> <!-- Subtask indicator -->
                </div>
            </div>
            <div class="task-actions">
                <button class="button-icon"><i class="fas fa-calendar-plus"></i></button>
                <button class="button-icon" onclick="openModal('task-detail-modal')"><i
                        class="fas fa-edit"></i></button>
                <button class="button-icon"><i class="fas fa-ellipsis-v"></i></button>
            </div>
        </li>
        <!-- More tasks... -->

        <!-- Example Checklist Task -->
        <li>
            <h4 style="margin: 1em 0 0.5em 0.5em; font-size: 0.9em;">我的清单 / 购物</h4>
        </li>
        <li class="task-item">
            <label class="checkbox-custom task-checkbox">
                <input type="checkbox" disabled> <!-- Container not checkable -->
                <span class="checkmark" style="background-color: #eee;"></span>
            </label>
            <div class="task-content">
                <span class="task-title" style="font-weight: 500;"
                    onclick="openModal('task-detail-modal')">本周购物清单</span>
                <div class="task-meta">
                    <span><i class="far fa-calendar"></i> 本周六</span>
                    <span><i class="far fa-check-square"></i> 2/4 完成</span>
                </div>
                <!-- Subtasks shown inline or in modal -->
            </div>
            <div class="task-actions">
                <button class="button-icon" onclick="openModal('task-detail-modal')"><i class="fas fa-eye"></i></button>
                <!-- View instead of edit -->
                <button class="button-icon"><i class="fas fa-ellipsis-v"></i></button>
            </div>
        </li>
    </ul>
</main>
<!-- (Include closing .main-container, <footer>, modals, <script>) -->
