[project]
name = "vue-fastapi-admin"
version = "0.1.0"
description = "Vue Fastapi admin"
authors = [
    { name = "mizhexiaoxiao", email = "mizhexiaoxiao@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    # —— Web 框架与服务器 ——
    # uvicorn[standard] 一次带齐 uvloop / httptools / websockets / watchfiles，
    # 不要把这几个再单独列一遍：那样等于把 extras 的内容手工摊平，升级时必然漏。
    "fastapi==0.111.0",
    "uvicorn[standard]==0.34.0",
    "starlette==0.37.2",

    # —— 数据库 ——
    # asyncmy 是 MySQL 驱动，代码里不 import，由 tortoise 按 engine 名加载；
    # 删掉它容器会在连库那一刻才失败。
    "tortoise-orm==0.23.0",
    "asyncmy>=0.2.13",
    "aerich==0.8.1",

    # —— 校验与配置 ——
    # email-validator 同样不被直接 import，是 pydantic 的 EmailStr 需要它
    # （app/schemas/users.py 用了），缺了会在导入 schema 时就崩。
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "email-validator==2.2.0",

    # —— 鉴权 ——
    # argon2-cffi 是 passlib 的 argon2 后端（app/utils/password.py 指定了 schemes=["argon2"]）
    "passlib==1.7.4",
    "argon2-cffi==23.1.0",
    "pyjwt==2.10.1",

    # —— 其他运行时 ——
    # httpx 是运行时依赖不是测试依赖：app/utils/wechat.py 用它调微信的 sns/jscode2session。
    "httpx==0.28.1",
    # setuptools 看着像构建期工具，其实是运行时必需：passlib 1.7.4 的 passlib/pwd.py
    # 顶层 `import pkg_resources`，而 pkg_resources 由 setuptools 提供。
    # uv 建的 venv 默认不 seed setuptools（新版 Python 的标准 venv 也不再预装），
    # 所以不显式声明的话，app/controllers 一导入就 ModuleNotFoundError: pkg_resources。
    "setuptools==75.8.0",
    "loguru==0.7.3",
    "pytz==2024.2",
]

[dependency-groups]
# 这一组不进运行镜像（Dockerfile 走 uv sync --no-dev）。
#
# 测试用的 sqlite 驱动 aiosqlite 故意不列在这里：tortoise-orm 本身就依赖它，
# 无论有没有 --no-dev 都装得上。列进来会让「dev 组 = 不进镜像」这句话变成假的。
dev = [
    "black==24.10.0",
    "isort==5.13.2",
    "ruff==0.9.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
]

[tool.black]
line-length = 120
target-version = [
    "py310",
    "py311",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = []
ignore = [
    "F403",
    "F405",
]

[tool.aerich]
tortoise_orm = "app.settings.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
