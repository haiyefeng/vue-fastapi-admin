  <path d="M356 70 C358 84 363 89 377 91 C363 93 358 98 356 112 C354 98 349 93 335 91 C349 89 354 84 356 70 Z" fill="#ffe9c2"/>

  <!-- 沙漏：玻璃轮廓（奶油白描边） -->
